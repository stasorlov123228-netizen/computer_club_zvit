
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - Lviv Arena</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0b0e13;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            background: #141a23;
            border: 1px solid #293341;
            border-radius: 14px;
        }

        h1 {
            text-align: center;
            color: #65ff9a;
        }

        p { color: #aeb8c7; }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #0b0e13;
            border: 1px solid #394658;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #65ff9a;
            color: #0b0e13;
            font-weight: bold;
            cursor: pointer;
        }

        .link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #65ff9a;
            text-decoration: none;
        }

        .helptext {
            display: block;
            margin-top: 6px;
            font-size: 12px;
        }

        .errorlist { color: #ff7777; }


        
        .back-home {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #65ff9a;
            text-decoration: none;
            font-size: 15px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .back-home {
                top: 15px;
                left: 15px;
            }
        }


    </style>
</head>

<body>
    <div class="container">
        <h1>Створення акаунта</h1>
        <p>Зареєструйтеся в комп'ютерному клубі Lviv Arena.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">ЗАРЕЄСТРУВАТИСЯ</button>
        </form>

        <a class="link" href="{% url 'login' %}">
            Уже маєте акаунт? Увійти
        </a>

        
        <a class="back-home" href="/"> На головну</a>

    </div>
</body>
</html>
