<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin panel{% endblock %} - Lviv Arena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: radial-gradient(ellipse at center, #183326 0%, #0b0e13 65%);
            background-attachment: fixed;
            color: #ffffff;
        }

        /* ШАПКА */

        .page-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 16px 4%;
            background: rgba(8, 11, 9, 0.96);
            border-bottom: 1px solid rgba(101, 255, 154, 0.22);
            backdrop-filter: blur(14px);
        }

        .logo {
            flex-shrink: 0;
            color: #65ff9a;
            font-family: 'Orbitron', sans-serif;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
            white-space: nowrap;
        }

        .admin-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .admin-nav a {
            padding: 11px 14px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
            border-radius: 5px;
            transition: color 0.25s, background 0.25s, border-color 0.25s;
        }

        .admin-nav button {
            padding: 11px 14px;
            color: #65ff9a;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            background: transparent;
            border: 1px solid rgba(101, 255, 154, 0.5);
            border-radius: 5px;
            cursor: pointer;
            transition: color 0.25s, background 0.25s, border-color 0.25s;
        }

        .admin-nav button:hover {
            color: #080b09;
            background: #65ff9a;
        }

        .admin-nav a:hover {
            color: #65ff9a;
            background: rgba(101, 255, 154, 0.08);
        }

        .admin-nav a.active {
            color: #080b09;
            background: #65ff9a;
            border-color: #65ff9a;
        }

        .admin-nav a.home-link {
            color: #65ff9a;
            border-color: rgba(101, 255, 154, 0.5);
        }

        .admin-nav a.home-link:hover {
            color: #080b09;
            background: #65ff9a;
        }

        /* БУРГЕР */

        .burger {
            display: none;
            width: 44px;
            height: 44px;
            padding: 9px;
            background: transparent;
            border: 1px solid rgba(101, 255, 154, 0.5);
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .burger span {
            display: block;
            width: 100%;
            height: 2px;
            margin: 5px 0;
            background: #65ff9a;
            border-radius: 2px;
            transition: transform 0.25s, opacity 0.25s;
        }

        .burger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .burger.active span:nth-child(2) {
            opacity: 0;
        }

        .burger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ВМІСТ */

        main {
            flex: 1;
            width: 100%;
        }

        /* ПІДВАЛ */

        footer {
            text-align: center;
            padding: 25px;
            color: #778395;
            border-top: 1px solid #252b35;
            font-size: 13px;
        }

        /* АДАПТАЦІЯ */

        @media (max-width: 1050px) {
            .admin-nav a {
                padding: 10px 9px;
                font-size: 10px;
            }

            .admin-nav button {
                padding: 10px 9px;
                font-size: 10px;
            }
        }

        @media (max-width: 900px) {
            .page-header {
                padding: 14px 5%;
            }

            .logo {
                font-size: 19px;
            }

            .burger {
                display: block;
            }

            .admin-nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                flex-wrap: nowrap;
                gap: 6px;
                padding: 16px 5% 22px;
                background: rgba(8, 11, 9, 0.98);
                border-bottom: 1px solid rgba(101, 255, 154, 0.3);
                box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
            }

            .admin-nav.active {
                display: flex;
            }

            .admin-nav a {
                padding: 14px 12px;
                font-size: 12px;
                text-align: center;
            }

            .admin-nav button {
                width: 100%;
                padding: 14px 12px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="page-header">
        <a href="{% url 'admin_panel' %}" class="logo">LVIV ARENA</a>

        <button class="burger" id="burger" type="button"
                aria-label="Відкрити меню" aria-expanded="false" aria-controls="admin-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="admin-nav" id="admin-nav">
            <a href="{% url 'admin_bookings' %}"
               class="{% if request.resolver_match.url_name == 'admin_bookings' %}active{% endif %}">
                ПЕРЕГЛЯНУТИ БРОНЮВАННЯ
            </a>

            <a href="{% url 'admin_users' %}"
               class="{% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
                КОРИСТУВАЧІ
            </a>

            <a href="{% url 'admin_tariffs' %}"
               class="{% if request.resolver_match.url_name == 'admin_tariffs' %}active{% endif %}">
                КЕРУВАТИ ТАРИФАМИ
            </a>

            <a href="{% url 'admin_computers' %}"
               class="{% if request.resolver_match.url_name == 'admin_computers' %}active{% endif %}">
                КЕРУВАТИ КОМП'ЮТЕРАМИ
            </a>

            <a href="{% url 'home' %}" class="home-link">НА ГОЛОВНУ</a>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">ВИЙТИ</button>
            </form>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        © 2026 Lviv Arena — Admin panel
    </footer>

    <script>
        const burger = document.getElementById('burger');
        const nav = document.getElementById('admin-nav');

        function closeMenu() {
            nav.classList.remove('active');
            burger.classList.remove('active');
            burger.setAttribute('aria-expanded', 'false');
        }

        burger.addEventListener('click', function () {
            const isOpen = nav.classList.toggle('active');
            burger.classList.toggle('active', isOpen);
            burger.setAttribute('aria-expanded', String(isOpen));
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeMenu();
            }
        });

        window.addEventListener('resize', function () {
            if (window.innerWidth > 900) {
                closeMenu();
            }
        });
    </script>

</body>
</html>
